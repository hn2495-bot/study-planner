<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A one-screen study planner: Gantt chart, today's to-dos, exam countdowns. Data stays in your browser.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F9; --surface:#FFFFFF; --ink:#1A2230; --muted:#5D6878; --line:#DCE2E9; --grid:#ECEFF3; --wkend:#F7F8FA;
  --navy:#1F3A5F; --today:#FFF4D6; --todayline:#E0A100;
  --pink:#F9CFE0; --pink-ink:#7A1D47; --hot:#E2508A; --hot-ink:#FFFFFF;
  --done:#DADFE5; --done-ink:#788290;
  --late:#C4251A; --load:#B86A00; --focus:#2F6DB5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12171E; --surface:#1A212B; --ink:#E7ECF2; --muted:#9AA6B4; --line:#2D3744; --grid:#222B36; --wkend:#161C24;
    --navy:#A9CBEB; --today:#3A3215; --todayline:#E9B93A;
    --pink:#5B2741; --pink-ink:#FAD3E3; --hot:#D2457E; --hot-ink:#FFFFFF;
    --done:#2C343F; --done-ink:#7D8896; --late:#F5867B; --load:#F0B45C; --focus:#80B3EA;
  }
}
:root[data-theme="dark"]{
  --paper:#12171E; --surface:#1A212B; --ink:#E7ECF2; --muted:#9AA6B4; --line:#2D3744; --grid:#222B36; --wkend:#161C24;
  --navy:#A9CBEB; --today:#3A3215; --todayline:#E9B93A;
  --pink:#5B2741; --pink-ink:#FAD3E3; --hot:#D2457E; --hot-ink:#FFFFFF;
  --done:#2C343F; --done-ink:#7D8896; --late:#F5867B; --load:#F0B45C; --focus:#80B3EA;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding:18px 18px 60px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:1.25rem;font-weight:900;margin:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-weight:500}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper);font-weight:700}
.tab.add{border-style:dashed;color:var(--muted)}
.save{font-size:.8rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.small{padding:2px 9px;font-size:.84rem}

/* today */
.today-wrap{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:14px;margin-bottom:22px}
.now{background:var(--hot);color:var(--hot-ink);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.now .lbl{font-size:.85rem;font-weight:700;opacity:.9}
.now .ttl{font-size:1.45rem;font-weight:900;line-height:1.25}
.now .sub{font-size:.9rem;opacity:.92}
.now .btn{align-self:flex-start;background:var(--hot-ink);color:var(--hot);border:0;font-weight:700;margin-top:auto}
.now.clear{background:var(--done);color:var(--ink)}
.todo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.todo-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.todo-h b{font-size:1rem}
.todo-h span{font-size:.88rem;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--grid)}
.tl li:first-child{border-top:0}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--hot);background:transparent;padding:0}
.ck.on{background:var(--done-ink);border-color:var(--done-ink)}
.tl .t{background:none;border:0;padding:0;text-align:left;font-weight:500}
.tl .t:hover{text-decoration:underline}
.tl li.done .t{color:var(--done-ink);text-decoration:line-through}
.tl .m{font-size:.8rem;color:var(--muted);white-space:nowrap}
.tl .late{color:var(--late);font-weight:700}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* gantt */
.gbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.gbar h2{font-size:1rem;margin:0 8px 0 0}
.hint{font-size:.8rem;color:var(--muted)}
.legend{display:flex;gap:10px;font-size:.8rem;color:var(--muted);margin-left:auto;align-items:center}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.gantt{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.grow{display:flex;border-top:1px solid var(--line)}
.grow:first-child{border-top:0}
.glabel{position:sticky;left:0;z-index:3;background:var(--surface);width:250px;flex:none;border-right:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:4px;border-left:5px solid var(--c,transparent)}
.cname{background:none;border:0;padding:0;text-align:left;font-weight:700;line-height:1.3}
.cname:hover{text-decoration:underline}
.cmeta{font-size:.78rem;color:var(--muted)}
.quick{display:flex;gap:4px}
.q{border:1px solid var(--hot);color:var(--hot);background:transparent;border-radius:6px;padding:0 7px;font-size:.8rem;font-weight:700;line-height:1.7}
.q:hover{background:var(--hot);color:var(--hot-ink)}
.track{position:relative;flex:none}
.day{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid)}
.day.we{background:var(--wkend)}
.day.td{background:var(--today);border-left:2px solid var(--todayline)}
.hdr .glabel{justify-content:flex-end;font-size:.8rem;color:var(--muted)}
.dh{position:absolute;top:0;text-align:center;font-size:.76rem;line-height:1.25;padding-top:6px;color:var(--muted)}
.dh b{display:block;font-size:.9rem;color:var(--ink);font-variant-numeric:tabular-nums}
.dh.td b{color:var(--todayline)}
.dh .ld{display:block;margin-top:3px;font-weight:700;font-size:.74rem;color:var(--muted)}
.dh .ld.hv{color:var(--load)}
.bar{position:absolute;height:26px;border-radius:6px;border:0;padding:0 7px;font-size:.78rem;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--pink);color:var(--pink-ink);z-index:2;transition:background-color .15s,color .15s}
.bar.k{background:var(--hot);color:var(--hot-ink)}
.bar.done{background:var(--done);color:var(--done-ink);text-decoration:line-through}
.bar.overdue{box-shadow:inset 0 0 0 2px var(--late)}
.bar:hover{filter:brightness(.96)}
.emptyrow{padding:22px;color:var(--muted)}
.addrow{padding:10px}

/* dialog */
dialog{border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,15,20,.45)}
.mhead{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);z-index:1}
.mhead h3{margin:0;font-size:1.05rem}
.mbody{padding:16px 18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:.85rem;font-weight:700}
.field .fh{font-size:.78rem;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
.swatches,.dows{display:flex;gap:8px;flex-wrap:wrap}
.cs{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.cs[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.dw{border:1px solid var(--line);background:var(--paper);border-radius:6px;width:36px;height:32px}
.dw[aria-pressed="true"]{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.mfoot{display:flex;justify-content:space-between;gap:8px;padding-top:6px}
.x{background:none;border:0;color:var(--muted);font-size:1.1rem;line-height:1}
.x:hover{color:var(--late)}
.donebig{width:100%;padding:10px;border-radius:8px;border:0;font-weight:900;font-size:1rem;background:var(--hot);color:var(--hot-ink);margin-bottom:14px}
.donebig.on{background:var(--done);color:var(--done-ink)}
/* topics */
.wk{border-top:1px solid var(--line);padding:9px 0}
.wk.cur{background:var(--today);margin:0 -18px;padding:9px 18px}
.wk-h{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.wk-h span{font-size:.8rem;color:var(--muted)}
.item{display:grid;grid-template-columns:22px 1fr 96px 24px;gap:8px;align-items:center;padding:2px 0}
.item select{padding:3px 4px;font-size:.82rem}
.item .t{background:none;border:0;text-align:left;padding:0}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.addbar{display:grid;grid-template-columns:1fr 110px auto;gap:6px}
details{margin-top:8px}summary{cursor:pointer;font-size:.88rem;color:var(--muted)}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 14px;display:flex;gap:12px;align-items:center;z-index:50;font-size:.92rem}
.toast button{background:none;border:0;color:var(--paper);text-decoration:underline;font-weight:700}
@media (max-width:820px){.today-wrap{grid-template-columns:1fr}.glabel{width:170px}.row3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
:root{--prep:#F8C8DB;--prep-ink:#7A1D47;--prep-s:#D63F7A;--rev:#C9E0F6;--rev-ink:#173E6B;--rev-s:#2F6DB5;--hw-s:#E0701F;--hw-ink:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--prep:#5B2741;--prep-ink:#FAD3E3;--prep-s:#D2457E;--rev:#1F3B5C;--rev-ink:#CFE3F8;--rev-s:#4D8DD6;--hw-s:#D9691C}}
:root[data-theme="dark"]{--prep:#5B2741;--prep-ink:#FAD3E3;--prep-s:#D2457E;--rev:#1F3B5C;--rev-ink:#CFE3F8;--rev-s:#4D8DD6;--hw-s:#D9691C}
.bar.prep{background:var(--prep);color:var(--prep-ink)}
.bar.rev{background:var(--rev);color:var(--rev-ink)}
.bar.hw{background:var(--hw-s);color:var(--hw-ink)}
.bar.done{background:var(--done);color:var(--done-ink)}
.ck.prep{border-color:var(--prep-s)}.ck.rev{border-color:var(--rev-s)}.ck.hw{border-color:var(--hw-s)}
.ck.on{background:var(--done-ink);border-color:var(--done-ink)}
.now.prep{background:var(--prep-s)}.now.rev{background:var(--rev-s)}.now.hw{background:var(--hw-s)}
.now.prep .btn{color:var(--prep-s)}.now.rev .btn{color:var(--rev-s)}.now.hw .btn{color:var(--hw-s)}
.q.prep{border-color:var(--prep-s);color:var(--prep-s)}.q.prep:hover{background:var(--prep-s);color:#fff}
.q.rev{border-color:var(--rev-s);color:var(--rev-s)}.q.rev:hover{background:var(--rev-s);color:#fff}
.q.hw{border-color:var(--hw-s);color:var(--hw-s)}.q.hw:hover{background:var(--hw-s);color:#fff}
:root{--self:#CDEBD8;--self-ink:#1E5A37;--self-s:#2E8B57;--exam-s:#8E44C9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--self:#1E3F2C;--self-ink:#CFEBDA;--self-s:#45A86E;--exam-s:#A35BDB}}
:root[data-theme="dark"]{--self:#1E3F2C;--self-ink:#CFEBDA;--self-s:#45A86E;--exam-s:#A35BDB}
.bar.self{background:var(--self);color:var(--self-ink)}
.bar.exam{background:var(--exam-s);color:#fff}
.bar.done{background:var(--done);color:var(--done-ink)}
.ck.self{border-color:var(--self-s)}.ck.exam{border-color:var(--exam-s)}
.ck.on{background:var(--done-ink);border-color:var(--done-ink)}
.now.self{background:var(--self-s)}.now.exam{background:var(--exam-s)}
.now.self .btn{color:var(--self-s)}.now.exam .btn{color:var(--exam-s)}
.q.self{border-color:var(--self-s);color:var(--self-s)}.q.self:hover{background:var(--self-s);color:#fff}
.q.exam{border-color:var(--exam-s);color:var(--exam-s)}.q.exam:hover{background:var(--exam-s);color:#fff}
.quick{flex-wrap:wrap}
.exams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.exams[hidden]{display:none}
.ex{text-align:left;border:0;border-left:6px solid var(--exam-s);border-radius:12px;padding:12px 16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:1px}
.exl{font-size:.88rem;font-weight:700;color:var(--muted)}
.exn{font-size:1.05rem;font-weight:700;line-height:1.2}
.exn b{font-size:2.1rem;font-weight:900;color:var(--exam-s);font-variant-numeric:tabular-nums}
.exd{font-size:.78rem;color:var(--muted)}
.ex.near{background:var(--exam-s);color:#fff;box-shadow:none}
.ex.near .exl,.ex.near .exd{color:#fff;opacity:.92}
.ex.near .exn b{color:#fff}
.today-wrap{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tc{border-radius:12px;padding:12px 14px;color:#fff;display:flex;flex-direction:column;gap:3px;min-height:120px;background:var(--prep-s)}
.tc.prep{background:var(--prep-s)}.tc.rev{background:var(--rev-s)}.tc.self{background:var(--self-s)}.tc.hw{background:var(--hw-s)}.tc.exam{background:var(--exam-s)}
.tc.late{box-shadow:0 0 0 3px var(--late)}
.tct{background:none;border:0;padding:0;color:inherit;text-align:left;font-weight:900;font-size:1.1rem;line-height:1.3}
.tct:hover{text-decoration:underline}
.tcm{font-size:.84rem;opacity:.95}
.tcb{margin-top:auto;align-self:flex-start;border:0;border-radius:8px;padding:5px 14px;font-weight:900;background:#fff;color:var(--ink)}
.tc.prep .tcb{color:var(--prep-s)}.tc.rev .tcb{color:var(--rev-s)}.tc.self .tcb{color:var(--self-s)}.tc.hw .tcb{color:var(--hw-s)}.tc.exam .tcb{color:var(--exam-s)}
.tc.done{background:var(--done);color:var(--done-ink);min-height:0}
.tc.done .tct{text-decoration:line-through;font-size:1rem}
.tc.done .tcb{background:transparent;color:var(--done-ink);border:1px solid var(--done-ink);font-weight:700;padding:2px 10px}
.bar.prep{background:var(--prep-s);color:#fff}.bar.rev{background:var(--rev-s);color:#fff}.bar.self{background:var(--self-s);color:#fff}
.bar.done{background:var(--done);color:var(--done-ink)}
.rep{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.rep .dows{align-items:center}
.todo{position:relative;overflow:hidden;isolation:isolate}
.todo::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bgimg,var(--bgdefault)) center/cover no-repeat;opacity:var(--bgop,.47);pointer-events:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .todo::before{opacity:calc(var(--bgop,.47)*.8)}}
:root{--bgdefault:none}
.todo.nobg::before{display:none}
.bgbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:.8rem;color:var(--muted);margin-left:8px}
.bgbtn:hover{border-color:var(--muted)}
.bgprev{height:120px;border-radius:8px;border:1px solid var(--line);position:relative;overflow:hidden;isolation:isolate;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700}
.bgprev::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--pimg,var(--bgdefault)) center/cover no-repeat;opacity:var(--pop)}
.slider{display:flex;gap:10px;align-items:center}.slider input{flex:1}.slider b{width:44px;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Study Planner</h1>
    <div class="tabs" id="tabs" role="tablist"></div>
    <span class="save" id="save" aria-live="polite"></span>
    <button class="btn" id="btnBackup">Backup</button>
  </header>
  <section class="exams" id="exams" aria-label="Exam countdown" hidden></section>

  <section class="today-wrap" aria-label="Today">
    <div class="todo" id="todo"></div>
  </section>

  <section aria-labelledby="h-g">
    <div class="gbar">
      <h2 id="h-g">Timeline</h2>
      <button class="btn small" id="prev" aria-label="Previous week">◀</button>
      <button class="btn small" id="thisweek">This week</button>
      <button class="btn small" id="next" aria-label="Next week">▶</button>
      <span class="hint">Click: mark done ⇄ undo · Double-click: details</span>
      <span class="legend"><span><i class="sw" style="background:var(--prep-s)"></i>Prep</span><span><i class="sw" style="background:var(--rev-s)"></i>Review</span><span><i class="sw" style="background:var(--self-s)"></i>Self-study</span><span><i class="sw" style="background:var(--hw-s)"></i>Assignment</span><span><i class="sw" style="background:var(--exam-s)"></i>Exam</span><span><i class="sw" style="background:var(--done)"></i>Done</span></span>
    </div>
    <div class="gantt" id="gantt"></div>
  </section>
</div>

<dialog id="dlg"><div class="mhead"><h3 id="dlgTitle"></h3><button class="x" id="dlgClose" aria-label="Close">✕</button></div><div class="mbody" id="dlgBody"></div></dialog>

<script>
const COLORS=["#2F6DB5","#2E8B6E","#7A4FB5","#C24A75","#2F8FA3","#8A6D1F","#C0632F","#5B6878"];
const TYPES=["Prep","Review","Self-study","Assignment","Exam","Other"];
const KEY=t=>t==="Assignment"||t==="Exam";
const tcls=t=>t==="Review"?"rev":t==="Self-study"?"self":t==="Exam"?"exam":t==="Assignment"?"hw":"prep";
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const COL=56, DAYS=21, HEAVY=3;
let S={semesters:[],active:"",courses:[],tasks:[],topics:[]};
let offset=0, clickTimer=null;

const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="style")e.style.cssText=v;else e.setAttribute(k,v===true?"":v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}

/* dates */
function today0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function parseD(s){if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function diff(a,b){return Math.round((a-b)/864e5);}
function fmtD(s){const d=parseD(s);return d?`${DOW[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`:"";}
function monday(d){const x=new Date(d);const k=(x.getDay()+6)%7;return addDays(x,-k);}
const TODAY=()=>iso(today0());

/* model helpers */
const course=id=>S.courses.find(c=>c.id===id);
const semCourses=()=>S.courses.filter(c=>c.semId===S.active);
const short=c=>c?(c.code||c.name):"";

    h("div",{class:"row3"},field("Work on",plan,"Bar start"),field("Due",due,"Bar end"),field("Due time",time)),
    field("Estimated hours",est,"Used for the daily load"),field("Notes",notes),rep,
    h("div",{class:"mfoot",style:"margin-top:12px"},
      isNew?h("span"):h("div",{style:"display:flex;gap:8px"},h("button",{class:"btn danger",onclick:del},"Delete"),h("button",{class:"btn",onclick:dup},"Duplicate")),
      h("button",{class:"btn primary",onclick:save},isNew?"Add":"Save")));
  openDlg(isNew?"Add task":"Task details",body);if(isNew)title.focus();
}

function weekSelect(c,val,onchange){const n=Number(c.weeks)||14;const s=h("select",{"aria-label":"Week",onchange});s.append(h("option",{value:"",selected:!val},"Unscheduled"));for(let i=1;i<=n;i++)s.append(h("option",{value:i,selected:Number(val)===i},"Week "+i));return s;}
function openTopics(c){
  let scrolled=false;
  const draw=()=>{
    const w=curWeek(c),n=Number(c.weeks)||14,tps=S.topics.filter(t=>t.courseId===c.id);
    const item=t=>h("div",{class:"item"+(t.done?" done":"")},
      h("input",{type:"checkbox",checked:!!t.done,"aria-label":"Done",onchange:e=>{t.done=e.target.checked;persist();draw();}}),
      h("button",{class:"t",onclick:()=>{const v=prompt("Topic name",t.title);if(v!=null&&v.trim()){t.title=v.trim();persist();draw();}}},t.title),
      weekSelect(c,t.week,e=>{t.week=e.target.value?Number(e.target.value):"";persist();draw();}),
      h("button",{class:"x","aria-label":"Delete",onclick:()=>{S.topics=S.topics.filter(y=>y.id!==t.id);persist();draw();}},"✕"));
    const inp=h("input",{type:"text",placeholder:"Add a topic"}),sel=weekSelect(c,"",null);
    const add=()=>{const v=inp.value.trim();if(!v)return;S.topics.push({id:uid(),courseId:c.id,title:v,week:sel.value?Number(sel.value):"",done:false});persist();draw();};
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add();}});
    const bulk=h("textarea",{placeholder:"One topic per line (all go to “Unscheduled”)"});
    const root=h("div",{},h("div",{class:"addbar"},inp,sel,h("button",{class:"btn primary",onclick:add},"Add")),
      h("details",{},h("summary",{},"Add many at once"),bulk,h("div",{style:"margin-top:6px"},h("button",{class:"btn",onclick:()=>{bulk.value.split("\n").map(s=>s.trim()).filter(Boolean).forEach(s=>S.topics.push({id:uid(),courseId:c.id,title:s,week:"",done:false}));persist();draw();}},"Add as unscheduled"))),
      h("div",{style:"height:10px"}));
    const uns=tps.filter(t=>!t.week);
    root.append(h("div",{class:"wk"},h("div",{class:"wk-h"},h("b",{},"Unscheduled"),h("span",{},"Pick a week once you know it")),uns.length?uns.map(item):h("div",{class:"fh",style:"color:var(--muted);font-size:.85rem"},"None")));
    for(let i=1;i<=n;i++){const it=tps.filter(t=>Number(t.week)===i);root.append(h("div",{class:"wk"+(i===w?" cur":"")},h("div",{class:"wk-h"},h("b",{},`Week ${i}${i===w?" (this week)":""}`),h("span",{},weekRange(c,i))),it.map(item)));}
    $("dlgBody").replaceChildren(root);
    if(!scrolled){scrolled=true;setTimeout(()=>{const el=$("dlgBody").querySelector(".wk.cur");if(el)el.scrollIntoView({block:"center"});},0);}
  };
  openDlg(`${short(c)} — weekly topics`,h("div"),()=>render());draw();
}


function applyBg(el,bg=S.bg){
  const b=bg||{};el.classList.toggle("nobg",b.mode==="none"||!b.img);
  if(b.img)el.style.setProperty("--bgimg",`url("${b.img}")`);else el.style.removeProperty("--bgimg");
  const op=b.opacity!=null?b.opacity:.3;el.style.setProperty("--bgop",op);
}
function shrinkImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("img"));im.onload=()=>{const M=1400;let w=im.width,hh=im.height;const k=Math.min(1,M/Math.max(w,hh));w=Math.round(w*k);hh=Math.round(hh*k);const cv=document.createElement("canvas");cv.width=w;cv.height=hh;cv.getContext("2d").drawImage(im,0,0,w,hh);let q=.82,u=cv.toDataURL("image/jpeg",q);while(u.length>600000&&q>.4){q-=.1;u=cv.toDataURL("image/jpeg",q);}res(u);};im.src=r.result;};r.readAsDataURL(file);});}
function openBgSettings(){
  const orig=S.bg?{...S.bg}:null;let d={mode:"",img:"",opacity:.3,...(S.bg||{})};
  const live=()=>{applyBg($("todo"),d);prev.style.setProperty("--pop",d.mode==="none"||!d.img?0:d.opacity);if(d.img)prev.style.setProperty("--pimg",`url("${d.img}")`);else prev.style.removeProperty("--pimg");};
  const prev=h("div",{class:"bgprev"},"Today");
  const val=h("b",{},Math.round(d.opacity*100)+"%");
  const rng=h("input",{type:"range",min:0,max:100,step:1,value:Math.round(d.opacity*100),"aria-label":"Opacity",oninput:e=>{d.opacity=Number(e.target.value)/100;d.mode="";val.textContent=e.target.value+"%";live();}});
  const fi=h("input",{type:"file",accept:"image/*",style:"display:none",onchange:async e=>{const f=e.target.files[0];if(!f)return;e.target.value="";msg.textContent="Loading…";try{d.img=await shrinkImage(f);d.mode="";msg.textContent="";live();}catch(err){msg.textContent="Couldn’t read that image. Try another one.";}}});
  const msg=h("span",{class:"fh",style:"color:var(--muted);font-size:.8rem"});
  let saved=false;
  const body=h("div",{},prev,h("div",{style:"height:12px"}),
    field("Image",h("div",{style:"display:flex;gap:8px;flex-wrap:wrap;align-items:center"},fi,h("button",{class:"btn",onclick:()=>fi.click()},"Choose image"),h("button",{class:"btn",onclick:()=>{d.img="";d.mode="none";live();}},"Remove image"),msg),"Pick any image from your computer (it’s compressed automatically)"),
    field("Opacity",h("div",{class:"slider"},rng,val),"0% = invisible · 100% = full image. Lower it if text gets hard to read"),
    h("div",{class:"mfoot"},h("button",{class:"btn",onclick:()=>{closeDlg();}},"Cancel"),h("button",{class:"btn primary",onclick:()=>{S.bg={...d};saved=true;closeDlg();commit();}},"Save")));
  openDlg("Background",body,()=>{if(!saved){S.bg=orig;render();}});
  setTimeout(live,0);
}
function openBackup(){
  const exportFile=()=>{const blob=new Blob([JSON.stringify(snapshot(),null,1)],{type:"application/json"});const a=h("a",{href:URL.createObjectURL(blob),download:`study-planner-backup-${TODAY()}.json`});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);};
  const load=text=>{try{const d=normalize(JSON.parse(text));if(confirm("Replace all current data with this backup?")){S=d;closeDlg();commit();}}catch(e){alert("That file isn’t a valid backup.");}};
  const fi=h("input",{type:"file",accept:"application/json,.json",style:"display:none",onchange:e=>{const f=e.target.files[0];if(!f)return;f.text().then(load);e.target.value="";}});
  openDlg("Backup / restore",h("div",{},
    h("p",{style:"margin-top:0;font-size:.9rem"},"Your data lives only in this browser. Download a backup now and then — it’s also how you move to another computer or browser."),
    h("div",{style:"display:flex;gap:8px;flex-wrap:wrap"},fi,h("button",{class:"btn primary",onclick:exportFile},"Download backup (.json)"),h("button",{class:"btn",onclick:()=>fi.click()},"Restore from file…"))));
}
$("btnBackup").onclick=openBackup;

S=normalize(S);render();initStore();
setInterval(()=>{const k=TODAY();if(k!==renderToday.last){renderToday.last=k;render();}},60000);renderToday.last=TODAY();
</script>
